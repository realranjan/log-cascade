<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="480" viewBox="0 0 1200 480" role="img" aria-labelledby="arch-title arch-desc">
  <title id="arch-title">LogCascade Architecture Diagram</title>
  <desc id="arch-desc">Three-tier cascading log classification architecture diagram with Regex, Gemini Embeddings, Gemini LLM fallback, FastAPI, React, and Hugging Face Hub.</desc>

  <defs>
    <linearGradient id="arch-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070A12"/>
      <stop offset="100%" stop-color="#0E1322"/>
    </linearGradient>

    <linearGradient id="node-t1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E1E2E"/>
      <stop offset="100%" stop-color="#141422"/>
    </linearGradient>

    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#38BDF8"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#34D399"/>
    </marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#F59E0B"/>
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#C084FC"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1200" height="480" rx="16" fill="url(#arch-bg)"/>
  <rect width="1200" height="480" rx="16" fill="none" stroke="#1E293B" stroke-width="1.5"/>

  <!-- Header Banner -->
  <g transform="translate(48, 36)">
    <rect width="180" height="24" rx="6" fill="#0F172A" stroke="#334155" stroke-width="1"/>
    <text x="12" y="16" font-family="'SFMono-Regular', Consolas, monospace" font-size="11" font-weight="700" fill="#38BDF8">SYSTEM ARCHITECTURE</text>
    <text x="195" y="17" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" font-weight="600" fill="#94A3B8">End-to-End Cascading Telemetry Ingestion, Classification &amp; Serving Pipeline</text>
  </g>

  <!-- COLUMN 1: INGESTION -->
  <g id="col-input" transform="translate(48, 80)">
    <rect width="210" height="360" rx="12" fill="#0B1120" stroke="#1E293B" stroke-width="1"/>
    <rect x="14" y="14" width="182" height="26" rx="6" fill="#1E293B"/>
    <text x="105" y="31" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="700" fill="#E2E8F0" text-anchor="middle">1. TELEMETRY INGESTION</text>

    <!-- Box A: Single Log -->
    <g transform="translate(14, 56)">
      <rect width="182" height="76" rx="8" fill="#111827" stroke="#374151" stroke-width="1"/>
      <text x="12" y="22" font-family="'SFMono-Regular', Consolas, monospace" font-size="11" font-weight="700" fill="#38BDF8">POST /predict</text>
      <text x="12" y="42" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11.5" fill="#9CA3AF">Single Log JSON</text>
      <text x="12" y="60" font-family="'SFMono-Regular', Consolas, monospace" font-size="10" fill="#6B7280">{"log_message": "..."}</text>
    </g>

    <!-- Box B: Batch CSV -->
    <g transform="translate(14, 146)">
      <rect width="182" height="86" rx="8" fill="#111827" stroke="#374151" stroke-width="1"/>
      <text x="12" y="22" font-family="'SFMono-Regular', Consolas, monospace" font-size="11" font-weight="700" fill="#38BDF8">POST /predict/batch</text>
      <text x="12" y="42" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11.5" fill="#9CA3AF">CSV Upload Stream</text>
      <text x="12" y="60" font-family="'SFMono-Regular', Consolas, monospace" font-size="10" fill="#6B7280">Multi-column payload</text>
      <text x="12" y="74" font-family="'SFMono-Regular', Consolas, monospace" font-size="9.5" fill="#10B981">(preserves metadata)</text>
    </g>

    <!-- Box C: Cascade Router -->
    <g transform="translate(14, 246)">
      <rect width="182" height="96" rx="8" fill="#064E3B" stroke="#059669" stroke-width="1"/>
      <text x="12" y="24" font-family="'SFMono-Regular', Consolas, monospace" font-size="11.5" font-weight="700" fill="#6EE7B7">classify_log()</text>
      <text x="12" y="46" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" fill="#D1FAE5">Cascade Orchestrator</text>
      <text x="12" y="66" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" fill="#A7F3D0">• Zero source-bias</text>
      <text x="12" y="82" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" fill="#A7F3D0">• Confidence fall-through</text>
    </g>
  </g>

  <!-- Connect Ingestion to Cascade -->
  <path d="M 258 344 L 298 344 L 298 250 L 320 250" fill="none" stroke="#38BDF8" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- COLUMN 2: 3-TIER CASCADE ENGINE -->
  <g id="col-cascade" transform="translate(328, 80)">
    <rect width="470" height="360" rx="12" fill="#090E1A" stroke="#1E293B" stroke-width="1.5"/>
    <rect x="16" y="14" width="438" height="26" rx="6" fill="#1E293B"/>
    <text x="235" y="31" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="700" fill="#E2E8F0" text-anchor="middle">2. TRI-TIER HYBRID CASCADE (classify.py)</text>

    <!-- TIER 1 -->
    <g transform="translate(16, 50)">
      <rect width="438" height="82" rx="8" fill="#141824" stroke="#F59E0B" stroke-width="1.2"/>
      <rect x="12" y="10" width="18" height="18" rx="4" fill="#78350F"/>
      <text x="21" y="23" font-family="'SFMono-Regular', Consolas, monospace" font-size="11" font-weight="800" fill="#FBBF24" text-anchor="middle">1</text>
      <text x="38" y="24" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="700" fill="#FBBF24">Tier 1: Regex Fast-Path</text>
      <text x="350" y="23" font-family="'SFMono-Regular', Consolas, monospace" font-size="10.5" font-weight="600" fill="#64748B">&lt; 0.2ms | $0.00</text>
      
      <text x="14" y="46" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11.5" fill="#CBD5E1">Deterministic patterns: User logins, backups, file uploads, server reboots</text>
      <text x="14" y="66" font-family="'SFMono-Regular', Consolas, monospace" font-size="10.5" fill="#34D399">✓ Match: Returns System Notification / User Action (500 logs / 20.7%)</text>
    </g>

    <!-- Fallthrough arrow 1 -> 2 -->
    <path d="M 235 132 L 235 146" fill="none" stroke="#F59E0B" stroke-width="1.5" marker-end="url(#arrow-amber)"/>
    <text x="245" y="142" font-family="'SFMono-Regular', Consolas, monospace" font-size="9.5" fill="#94A3B8">no match</text>

    <!-- TIER 2 -->
    <g transform="translate(16, 150)">
      <rect width="438" height="96" rx="8" fill="#141824" stroke="#10B981" stroke-width="1.2"/>
      <rect x="12" y="10" width="18" height="18" rx="4" fill="#064E3B"/>
      <text x="21" y="23" font-family="'SFMono-Regular', Consolas, monospace" font-size="11" font-weight="800" fill="#34D399" text-anchor="middle">2</text>
      <text x="38" y="24" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="700" fill="#34D399">Tier 2: Gemini Embeddings + Logistic Regression</text>
      <text x="348" y="23" font-family="'SFMono-Regular', Consolas, monospace" font-size="10.5" font-weight="600" fill="#64748B">~14ms | 99.74%</text>

      <text x="14" y="46" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11.5" fill="#CBD5E1">gemini-embedding-001 (768-dim) + Stratified Logistic Regression</text>
      <text x="14" y="66" font-family="'SFMono-Regular', Consolas, monospace" font-size="10.5" fill="#38BDF8">✓ Confidence Gate: Max Class Probability ≥ 0.50 (1,903 logs / 78.8%)</text>
      <text x="14" y="84" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" fill="#94A3B8">Labels: HTTP Status, Security Alert, Resource Usage, Error, Critical Error</text>
    </g>

    <!-- Fallthrough arrow 2 -> 3 -->
    <path d="M 235 246 L 235 260" fill="none" stroke="#C084FC" stroke-width="1.5" marker-end="url(#arrow-purple)"/>
    <text x="245" y="256" font-family="'SFMono-Regular', Consolas, monospace" font-size="9.5" fill="#EF4444">prob &lt; 0.50 (low confidence)</text>

    <!-- TIER 3 -->
    <g transform="translate(16, 264)">
      <rect width="438" height="84" rx="8" fill="#141824" stroke="#A855F7" stroke-width="1.2"/>
      <rect x="12" y="10" width="18" height="18" rx="4" fill="#581C87"/>
      <text x="21" y="23" font-family="'SFMono-Regular', Consolas, monospace" font-size="11" font-weight="800" fill="#C084FC" text-anchor="middle">3</text>
      <text x="38" y="24" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="700" fill="#C084FC">Tier 3: Gemini LLM Reasoner (Fallback)</text>
      <text x="345" y="23" font-family="'SFMono-Regular', Consolas, monospace" font-size="10.5" font-weight="600" fill="#64748B">On-Demand</text>

      <text x="14" y="46" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11.5" fill="#CBD5E1">Few-shot LLM reasoning for ambiguous anomalies and rare edge cases</text>
      <text x="14" y="66" font-family="'SFMono-Regular', Consolas, monospace" font-size="10.5" fill="#C084FC">✓ Resolves Workflow Error &amp; Deprecation Warning (&lt; 0.5% volume)</text>
    </g>
  </g>

  <!-- Connect Cascade to Serving -->
  <path d="M 798 250 L 840 250" fill="none" stroke="#38BDF8" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- COLUMN 3: SERVING & REGISTRY -->
  <g id="col-serving" transform="translate(848, 80)">
    <rect width="304" height="360" rx="12" fill="#0B1120" stroke="#1E293B" stroke-width="1"/>
    <rect x="14" y="14" width="276" height="26" rx="6" fill="#1E293B"/>
    <text x="152" y="31" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="700" fill="#E2E8F0" text-anchor="middle">3. SERVING &amp; REGISTRY</text>

    <!-- Box 1: FastAPI -->
    <g transform="translate(14, 52)">
      <rect width="276" height="88" rx="8" fill="#111827" stroke="#374151" stroke-width="1"/>
      <text x="12" y="22" font-family="'SFMono-Regular', Consolas, monospace" font-size="12" font-weight="700" fill="#34D399">FastAPI Backend (api.py)</text>
      <text x="12" y="42" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" fill="#9CA3AF">• Non-blocking async endpoints</text>
      <text x="12" y="58" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" fill="#9CA3AF">• Background retrain thread pool</text>
      <text x="12" y="74" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" fill="#9CA3AF">• Dynamic version query (?version=v1.0)</text>
    </g>

    <!-- Box 2: React UI -->
    <g transform="translate(14, 150)">
      <rect width="276" height="96" rx="8" fill="#111827" stroke="#374151" stroke-width="1"/>
      <text x="12" y="22" font-family="'SFMono-Regular', Consolas, monospace" font-size="12" font-weight="700" fill="#60A5FA">React + Vite UI (frontend/)</text>
      <text x="12" y="42" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" fill="#9CA3AF">• Real-time single log triage</text>
      <text x="12" y="58" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" fill="#9CA3AF">• Drag-and-drop CSV batch upload</text>
      <text x="12" y="74" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" fill="#9CA3AF">• Distribution bar charts &amp; CSV export</text>
      <text x="12" y="90" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10.5" fill="#6B7280">Dark/Light native responsive theme</text>
    </g>

    <!-- Box 3: Hugging Face -->
    <g transform="translate(14, 256)">
      <rect width="276" height="88" rx="8" fill="#111827" stroke="#374151" stroke-width="1"/>
      <text x="12" y="22" font-family="'SFMono-Regular', Consolas, monospace" font-size="12" font-weight="700" fill="#FBBF24">Hugging Face Model Registry</text>
      <text x="12" y="42" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" fill="#9CA3AF">• Automatic model versioning tags</text>
      <text x="12" y="58" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" fill="#9CA3AF">• Pulls latest artifact on startup</text>
      <text x="12" y="74" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" fill="#9CA3AF">• Multi-checkpoint version rollback</text>
    </g>
  </g>
</svg>
