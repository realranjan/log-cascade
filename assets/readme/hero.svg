<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="hero-title hero-desc">
  <title id="hero-title">LogCascade — Intelligent Tri-Tier Cascading Log Classification Engine</title>
  <desc id="hero-desc">High-throughput cascading log classifier routing telemetry through Regex, Gemini Embeddings, and Gemini LLM fallback with 99.74% accuracy.</desc>

  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080C14"/>
      <stop offset="50%" stop-color="#0D1321"/>
      <stop offset="100%" stop-color="#060910"/>
    </linearGradient>

    <linearGradient id="brand-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#60A5FA"/>
      <stop offset="100%" stop-color="#818CF8"/>
    </linearGradient>

    <linearGradient id="emerald-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>

    <linearGradient id="amber-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FBBF24"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>

    <linearGradient id="purple-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#C084FC"/>
      <stop offset="100%" stop-color="#A855F7"/>
    </linearGradient>

    <linearGradient id="border-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="40%" stop-color="#38BDF8" stop-opacity="0.3"/>
      <stop offset="80%" stop-color="#818CF8" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>

    <filter id="card-shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.6"/>
    </filter>

    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#1E293B" stroke-width="0.75" stroke-opacity="0.3"/>
    </pattern>
  </defs>

  <!-- Canvas Background -->
  <rect width="1200" height="420" rx="20" fill="url(#bg-grad)"/>
  <rect width="1200" height="420" rx="20" fill="url(#grid)"/>
  <rect width="1200" height="420" rx="20" fill="none" stroke="url(#border-glow)" stroke-width="1.5"/>

  <!-- Left: Brand & Story Block -->
  <g id="brand-block" transform="translate(60, 48)">
    <!-- Category Pill -->
    <rect width="268" height="26" rx="13" fill="#0F172A" stroke="#334155" stroke-width="1"/>
    <circle cx="12" cy="13" r="4" fill="#38BDF8"/>
    <text x="24" y="17" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#94A3B8" letter-spacing="1">OBSERVABILITY &amp; ML SYSTEMS</text>

    <!-- Main Title -->
    <g transform="translate(0, 72)">
      <text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="52" font-weight="900" letter-spacing="-1">
        <tspan fill="#F8FAFC">Log</tspan>
        <tspan fill="url(#brand-grad)">Cascade</tspan>
      </text>
    </g>

    <!-- Subtitle / Tagline -->
    <text x="0" y="108" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="600" fill="#E2E8F0">
      High-Throughput Cascading Hybrid Log Classifier
    </text>

    <!-- Narrative Description -->
    <text x="0" y="142" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14.5" font-weight="400" fill="#94A3B8">
      <tspan x="0" dy="0">Intelligently cascades raw log streams across three adaptive tiers:</tspan>
      <tspan x="0" dy="22">sub-millisecond Regex, 99.74% accurate Gemini Embeddings, and</tspan>
      <tspan x="0" dy="22">Gemini LLM reasoning. Maximize throughput while slashing token spend.</tspan>
    </text>

    <!-- Metric Badges Row -->
    <g transform="translate(0, 222)">
      <!-- Badge 1: Accuracy -->
      <g transform="translate(0, 0)">
        <rect width="168" height="66" rx="12" fill="#0B132B" stroke="#1E293B" stroke-width="1"/>
        <text x="16" y="24" font-family="'SFMono-Regular', Consolas, monospace" font-size="11" font-weight="600" fill="#34D399" letter-spacing="0.5">● ML BENCHMARK</text>
        <text x="16" y="49" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="22" font-weight="800" fill="#F8FAFC">99.74%</text>
        <text x="100" y="49" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="500" fill="#64748B">accuracy</text>
      </g>

      <!-- Badge 2: Latency -->
      <g transform="translate(180, 0)">
        <rect width="168" height="66" rx="12" fill="#0B132B" stroke="#1E293B" stroke-width="1"/>
        <text x="16" y="24" font-family="'SFMono-Regular', Consolas, monospace" font-size="11" font-weight="600" fill="#38BDF8" letter-spacing="0.5">⚡ TIER 1 LATENCY</text>
        <text x="16" y="49" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="22" font-weight="800" fill="#F8FAFC">&lt; 0.2ms</text>
        <text x="110" y="49" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="500" fill="#64748B">fast-path</text>
      </g>

      <!-- Badge 3: Cost Reduction -->
      <g transform="translate(360, 0)">
        <rect width="168" height="66" rx="12" fill="#0B132B" stroke="#1E293B" stroke-width="1"/>
        <text x="16" y="24" font-family="'SFMono-Regular', Consolas, monospace" font-size="11" font-weight="600" fill="#F59E0B" letter-spacing="0.5">★ COST EFFICIENCY</text>
        <text x="16" y="49" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="22" font-weight="800" fill="#F8FAFC">94.8%</text>
        <text x="96" y="49" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="500" fill="#64748B">savings</text>
      </g>
    </g>

    <!-- Tech Stack Mini-Pills -->
    <g transform="translate(0, 310)">
      <text x="0" y="14" font-family="'SFMono-Regular', Consolas, monospace" font-size="11" font-weight="600" fill="#64748B" letter-spacing="0.5">TECH STACK:</text>
      <g transform="translate(86, 0)">
        <rect width="64" height="20" rx="4" fill="#1E293B"/>
        <text x="32" y="14" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10.5" font-weight="600" fill="#E2E8F0" text-anchor="middle">FastAPI</text>
      </g>
      <g transform="translate(156, 0)">
        <rect width="82" height="20" rx="4" fill="#1E293B"/>
        <text x="41" y="14" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10.5" font-weight="600" fill="#E2E8F0" text-anchor="middle">React + Vite</text>
      </g>
      <g transform="translate(244, 0)">
        <rect width="90" height="20" rx="4" fill="#1E293B"/>
        <text x="45" y="14" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10.5" font-weight="600" fill="#E2E8F0" text-anchor="middle">Gemini Embed</text>
      </g>
      <g transform="translate(340, 0)">
        <rect width="78" height="20" rx="4" fill="#1E293B"/>
        <text x="39" y="14" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10.5" font-weight="600" fill="#E2E8F0" text-anchor="middle">Scikit-Learn</text>
      </g>
      <g transform="translate(424, 0)">
        <rect width="84" height="20" rx="4" fill="#1E293B"/>
        <text x="42" y="14" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10.5" font-weight="600" fill="#E2E8F0" text-anchor="middle">Hugging Face</text>
      </g>
    </g>
  </g>

  <!-- Right: Real-time Cascading Terminal Mockup -->
  <g id="terminal-proof" transform="translate(620, 38)" filter="url(#card-shadow)">
    <!-- Terminal Outer Frame -->
    <rect width="520" height="344" rx="14" fill="#070A10" stroke="#1E293B" stroke-width="1.5"/>

    <!-- Terminal Header Bar -->
    <rect width="520" height="36" rx="14" fill="#0F172A"/>
    <rect y="22" width="520" height="14" fill="#0F172A"/>
    <line x1="0" y1="36" x2="520" y2="36" stroke="#1E293B" stroke-width="1"/>

    <!-- Traffic Light Buttons -->
    <circle cx="20" cy="18" r="5" fill="#EF4444"/>
    <circle cx="36" cy="18" r="5" fill="#F59E0B"/>
    <circle cx="52" cy="18" r="5" fill="#10B981"/>

    <!-- Terminal Title -->
    <text x="260" y="22" font-family="'SFMono-Regular', Consolas, monospace" font-size="11.5" font-weight="600" fill="#94A3B8" text-anchor="middle">logcascade-router --live-stream</text>
    <rect x="425" y="10" width="80" height="17" rx="8" fill="#1E293B"/>
    <circle cx="437" cy="18.5" r="3" fill="#34D399"/>
    <text x="446" y="22" font-family="'SFMono-Regular', Consolas, monospace" font-size="9.5" font-weight="700" fill="#34D399">ACTIVE</text>

    <!-- Terminal Body / Simulated Log Cascade Rows -->
    <!-- Row 1: Regex Fast Path -->
    <g transform="translate(18, 52)">
      <rect width="484" height="76" rx="8" fill="#0B101B" stroke="#1E293B" stroke-width="1"/>
      <rect width="4" height="76" rx="2" fill="#F59E0B"/>
      
      <text x="14" y="18" font-family="'SFMono-Regular', Consolas, monospace" font-size="10.5" font-weight="700" fill="#F59E0B">TIER 1 • REGEX PATTERN MATCHER</text>
      <text x="420" y="18" font-family="'SFMono-Regular', Consolas, monospace" font-size="10.5" font-weight="600" fill="#64748B">0.14ms</text>
      
      <text x="14" y="38" font-family="'SFMono-Regular', Consolas, monospace" font-size="11" fill="#E2E8F0">&gt; "User 12345 logged in successfully."</text>
      
      <rect x="14" y="48" width="128" height="18" rx="4" fill="#1C1917" stroke="#78350F" stroke-width="0.8"/>
      <text x="78" y="61" font-family="'SFMono-Regular', Consolas, monospace" font-size="10" font-weight="600" fill="#FBBF24" text-anchor="middle">→ User Action</text>
      
      <text x="154" y="61" font-family="'SFMono-Regular', Consolas, monospace" font-size="10" fill="#94A3B8">Rule matched: \bUser\s+\d+\s+logged\b</text>
    </g>

    <!-- Row 2: Gemini Embeddings + Logistic Regression -->
    <g transform="translate(18, 138)">
      <rect width="484" height="88" rx="8" fill="#0B101B" stroke="#1E293B" stroke-width="1"/>
      <rect width="4" height="88" rx="2" fill="#34D399"/>
      
      <text x="14" y="18" font-family="'SFMono-Regular', Consolas, monospace" font-size="10.5" font-weight="700" fill="#34D399">TIER 2 • GEMINI EMBEDDING (768d) + LOGISTIC REGRESSION</text>
      <text x="422" y="18" font-family="'SFMono-Regular', Consolas, monospace" font-size="10.5" font-weight="600" fill="#64748B">14.2ms</text>
      
      <text x="14" y="38" font-family="'SFMono-Regular', Consolas, monospace" font-size="11" fill="#E2E8F0">&gt; "IP 192.168.133.114 blocked due to potential attack"</text>
      
      <rect x="14" y="52" width="138" height="22" rx="4" fill="#064E3B" stroke="#059669" stroke-width="0.8"/>
      <text x="83" y="67" font-family="'SFMono-Regular', Consolas, monospace" font-size="11" font-weight="700" fill="#6EE7B7" text-anchor="middle">→ Security Alert</text>
      
      <text x="162" y="67" font-family="'SFMono-Regular', Consolas, monospace" font-size="10.5" fill="#94A3B8">P(max) = <tspan fill="#34D399" font-weight="700">0.9984</tspan> ≥ 0.50 [ACCEPTED]</text>
    </g>

    <!-- Row 3: Gemini LLM Fallback -->
    <g transform="translate(18, 236)">
      <rect width="484" height="92" rx="8" fill="#0B101B" stroke="#1E293B" stroke-width="1"/>
      <rect width="4" height="92" rx="2" fill="#A855F7"/>
      
      <text x="14" y="18" font-family="'SFMono-Regular', Consolas, monospace" font-size="10.5" font-weight="700" fill="#C084FC">TIER 3 • GEMINI LLM REASONER (FALLBACK)</text>
      <text x="415" y="18" font-family="'SFMono-Regular', Consolas, monospace" font-size="10.5" font-weight="600" fill="#64748B">380ms</text>
      
      <text x="14" y="38" font-family="'SFMono-Regular', Consolas, monospace" font-size="11" fill="#E2E8F0">&gt; "Invoice generation aborted for order 8910: tax module invalid"</text>
      
      <text x="14" y="55" font-family="'SFMono-Regular', Consolas, monospace" font-size="10" fill="#EF4444">Tier 2 P(max) &lt; 0.50 (low confidence) → Escalated to LLM</text>
      
      <rect x="14" y="64" width="144" height="20" rx="4" fill="#581C87" stroke="#7E22CE" stroke-width="0.8"/>
      <text x="86" y="78" font-family="'SFMono-Regular', Consolas, monospace" font-size="10.5" font-weight="700" fill="#E9D5FF" text-anchor="middle">→ Workflow Error</text>
      
      <text x="168" y="78" font-family="'SFMono-Regular', Consolas, monospace" font-size="10" fill="#A855F7">Few-shot edge class resolved</text>
    </g>
  </g>
</svg>
